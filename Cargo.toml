[workspace]
members = [
    "crates/xpm-aur-core",
    "crates/xpm-aur-aur",
    "crates/xpm-aur-system",
    "crates/xpm-aur-build",
    "crates/xpm-aur-app",
    "crates/xpm-aur-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/equislinux/xpm-aur"
rust-version = "1.85"

[workspace.dependencies]
xpm-aur-core = { path = "crates/xpm-aur-core" }
xpm-aur-aur = { path = "crates/xpm-aur-aur" }
xpm-aur-system = { path = "crates/xpm-aur-system" }
xpm-aur-build = { path = "crates/xpm-aur-build" }
xpm-aur-app = { path = "crates/xpm-aur-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
